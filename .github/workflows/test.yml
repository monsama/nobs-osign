name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # pwsh comes with the runner.
      - run: npm test

  # The editor as most will run it: Windows PowerShell 5.1, and PowerShell 7.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node addin/build.mjs
      - run: node --test tests/editor.test.js tests/ui.test.js
        env:
          OSIGN_TEST_SHELL: ${{ matrix.shell }}
      # The setup script for Microsoft 365, in this shell: a step of its own, not next to the UI test.
      - run: node --test tests/server-setup.test.js
        env:
          OSIGN_TEST_SHELL: ${{ matrix.shell }}

  # The server's image: it builds, starts, answers its health check and shows the sign-in page;
  # and the scripts that install and update it pass shellcheck.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x deploy-nobs-osign.sh scripts/osign-lib.sh scripts/update.sh scripts/backup.sh scripts/restore.sh scripts/release.sh
      - run: docker build -t nobs-osign:ci .
      - name: Start it and ask it
        run: |
          docker run -d --name nobs-osign --read-only --tmpfs /tmp --cap-drop ALL -e OSIGN_ADMIN_PASSWORD=ci -e OSIGN_SECURE_COOKIE=0 -p 127.0.0.1:8080:8080 nobs-osign:ci
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' nobs-osign)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' nobs-osign | grep -qx healthy || { docker logs nobs-osign; exit 1; }
          curl -fsS http://127.0.0.1:8080/login | grep -q loginForm
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8080/api/info)" = 401
          # The add-in's template is in the image: info says the files can be made.
          c="$(curl -s -D - -o /dev/null -X POST -H 'Content-Type: application/json' -d '{"login":"admin","password":"ci"}' http://127.0.0.1:8080/api/login | grep -i '^set-cookie' | sed -E 's/^[^:]+: ([^;]+).*/\1/')"
          curl -fsS -X POST -H 'Content-Type: application/json' -H "Cookie: $c" -d '{}' http://127.0.0.1:8080/api/info | grep -q '"addinFiles":true'
          docker logs nobs-osign
