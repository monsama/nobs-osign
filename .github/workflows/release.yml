# Makes a release:
#  - the Docker image ghcr.io/monsama/nobs-osign:X.Y.Z, scanned before it is pushed, and attested
#  - nobs-osign-server-X.Y.Z.tar.gz: what an install of the server needs (Compose, deploy and update scripts),
#    with IMAGE: the image by its digest, so an install runs exactly the image that was scanned; attested too
#
# Runs on a version tag such as v0.5.0 (scripts/release.sh pushes one), or by hand (Actions →
# release → Run workflow) on main, which tags the version in package.json first. Tests must pass
# first. A version that is already tagged is refused.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read only by default; only the publishing job may write (the tag, the release).
permissions:
  contents: read

# Two releases never run at once; one started is never cancelled halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # By hand, only main is released: a release from another branch would publish code that is not on main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      # A dropped connection to the npm registry (ECONNRESET) is tried once more before the job fails.
      - run: npm ci || (sleep 15 && npm ci)
      - run: npx playwright install --with-deps chromium
      # pwsh comes with the runner, so the setup script's test runs too.
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # Signed statements of where the image and the server's files were built (GitHub artifact attestation, Sigstore).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: One version everywhere, and the tag's
        id: v
        run: |
          v="$(node -p 'require("./package.json").version')"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Not a version: $v"; exit 1; }
          grep -q "ghcr.io/monsama/nobs-osign:$v}" docker-compose.yml || { echo "docker-compose.yml is not version $v: node scripts/bump-version.mjs $v"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Run by hand: a version that is already tagged is refused, so a release is never published twice.
      - name: The version is not released yet
        if: github.event_name == 'workflow_dispatch'
        run: |
          t="v${{ steps.v.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$t" > /dev/null; then echo "$t is already released. Raise the version first."; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Build the add-in's template
        run: |
          npm ci || (sleep 15 && npm ci)
          node addin/build.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is built and scanned before anything is published: a high or critical problem in it stops the release.
      # The image pushed is the one scanned, and the release comes last, so there is never a release without its image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: |
            nobs-osign:scan
            ghcr.io/monsama/nobs-osign:${{ steps.v.outputs.version }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nobs-osign:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push the scanned image
        id: push
        run: |
          docker push "ghcr.io/monsama/nobs-osign:${{ steps.v.outputs.version }}"
          d="$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/monsama/nobs-osign:${{ steps.v.outputs.version }}")"
          echo "digest=${d#*@}" >> "$GITHUB_OUTPUT"
      # The server's files, with the image by its digest: an install pulls exactly the image just scanned.
      - name: Package the server's files
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p out
          echo "ghcr.io/monsama/nobs-osign:$V@${{ steps.push.outputs.digest }}" > out/IMAGE
          git archive --format=tar.gz --prefix="nobs-osign-server-$V/" --add-file=out/IMAGE -o "out/nobs-osign-server-$V.tar.gz" HEAD \
            deploy-nobs-osign.sh docker-compose.yml .env.example certificates/README.md \
            scripts/osign-lib.sh scripts/update.sh scripts/backup.sh scripts/restore.sh scripts/install-cert.sh README.md LICENSE
          (cd out && sha256sum "nobs-osign-server-$V.tar.gz" > "nobs-osign-server-$V.tar.gz.sha256")
          (cd out && sha256sum "nobs-osign-server-$V.tar.gz" > SHA256SUMS.txt)
      # Signs that the image and the server's files were built here, from this commit, by this workflow:
      # scripts/update.sh checks it with `gh attestation verify` where gh is there. A plan without attestations
      # for this repository does not stop the release.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        continue-on-error: true
        with:
          subject-path: out/nobs-osign-server-${{ steps.v.outputs.version }}.tar.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        continue-on-error: true
        with:
          subject-name: ghcr.io/monsama/nobs-osign
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Tag the version
        if: github.event_name == 'workflow_dispatch'
        run: |
          t="v${{ steps.v.outputs.version }}"
          git tag "$t" "$GITHUB_SHA" && git push origin "$t"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: NOBS OSign v${{ steps.v.outputs.version }}
          files: |
            out/nobs-osign-server-${{ steps.v.outputs.version }}.tar.gz
            out/nobs-osign-server-${{ steps.v.outputs.version }}.tar.gz.sha256
            out/SHA256SUMS.txt
          generate_release_notes: true
