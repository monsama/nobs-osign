# Makes a release as one zip: the editor (OSign.ps1, its UI, the shared engine) and the add-in's
# files with blanks for a company's settings, which the editor fills in (Settings → Outlook add-in).
#
# Either push a tag v1.2.3, or run this workflow by hand (Actions → release → Run workflow) with
# the version: it then makes the tag v1.2.3 itself, on the commit it runs on.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (must match editor/OSign.ps1 and package.json)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          v="${TAG#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Not a version: $v"; exit 1; }
          grep -q "AppVersion = '$v'" editor/OSign.ps1 || { echo "editor/OSign.ps1 is not version $v"; exit 1; }
          grep -q "\"version\": \"$v\"" package.json || { echo "package.json is not version $v"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Package
        run: |
          mkdir -p out/OSign/shared
          cp editor/OSign.ps1 out/OSign/
          cp -r editor/ui out/OSign/ui
          cp shared/signature-core.js out/OSign/shared/
          cp -r dist/template out/OSign/addin
          cp LICENSE out/OSign/
          (cd out && zip -r "OSign-${TAG}.zip" OSign)
          (cd out && sha256sum "OSign-${TAG}.zip" > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: OSign ${{ env.TAG }}
          files: |
            out/OSign-${{ env.TAG }}.zip
            out/SHA256SUMS.txt
          generate_release_notes: true
